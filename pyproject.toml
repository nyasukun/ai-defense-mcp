[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-defense-mcp"
version = "0.1.0"
description = "MCP Server for Cisco AI Defense"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.20.0"
]
[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
ai-defense-mcp = "src.server:main"
